<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft, premium background card -->
  <rect width="64" height="64" rx="18" fill="url(#bg-gradient)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="url(#border-gradient)" stroke-width="1.8" />

  <!-- Gradient & shadow filters for high-end depth -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="shadow" x="-5" y="-5" width="74" height="74" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Overlapping tokens with drop-shadow -->
  <g filter="url(#shadow)">
    <!-- X Symbol: Indigo 600 -->
    <path d="M15 17 L33 35 M33 17 L15 35" stroke="#4f46e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- O Symbol: Rose 500 -->
    <circle cx="43" cy="41" r="10.5" stroke="#f43f5e" stroke-width="7" fill="none" />
  </g>
</svg>